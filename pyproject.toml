[project]
name = "ha-ordnungstracker"
version = "0.0.0"
description = "Ordnungs-Tracker: Inventar für Home Assistant (nummerierte Behälter, Pfade, Suche)"
requires-python = ">=3.14"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["custom_components/ordnungstracker/core"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PL", "T20", "ANN"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLC0415",
  "RUF001", "RUF002", "RUF003",  # deutsche Anführungszeichen/Umlaute sind gewollt
  "ANN401",  # Any ist für JSON-Werte gewollt
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR", "T20", "B011"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/ordnungstracker/core"]
warn_unused_ignores = true

# Streng gilt für den Kern; die Home-Assistant-Schicht wird nur mitgelesen (Pflichtenheft 11).
[[tool.mypy.overrides]]
module = [
  "custom_components.ordnungstracker",
  "custom_components.ordnungstracker.*",
  "ordnungstracker",
  "ordnungstracker.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["custom_components.ordnungstracker.core.*", "ordnungstracker.core.*"]
ignore_errors = false

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
